# Builds the installer and publishes it as a GitHub Release whenever a
# version tag is pushed, e.g.:  git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" ./scripts/build-app.sh --dmg --zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ClipStack.dmg
            build/ClipStack.zip
          generate_release_notes: true

      - name: Upload build artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ClipStack
          path: |
            build/ClipStack.dmg
            build/ClipStack.zip
